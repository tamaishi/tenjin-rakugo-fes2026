<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta property="og:title" content="博多天神落語まつりアーカイブ">
<meta property="og:description" content="博多天神落語まつりのファン制作のまとめです">
<meta property="og:image" content="https://tamaishi.github.io/tenjin-rakugo-fes2026/ogp-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<title>博多天神落語まつりアーカイブ</title>

<style>
:root{
    --bg:#f5f5f5;
    --card:#ffffff;
    --text:#222;
    --border:#ddd;
    --link:#1565c0;
}

@media (prefers-color-scheme: dark){
    :root{
        --bg:#111;
        --card:#1e1e1e;
        --text:#eee;
        --border:#444;
        --link:#7ab7ff;
    }
}

*{
    box-sizing:border-box;
}
h1,h2,h3,p{
    margin: 0;
}
body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
    background:#222;
    color:white;
    padding:0 16px;
}

main{
    max-width:1400px;
    margin:auto;
    padding:0 20px;
}

.card{
    background:var(--card);
    border-radius:8px;
    padding:0 16px;
    border:1px solid var(--border);
}

button{
    padding:8px 12px;
    margin:4px;
    cursor:pointer;
}

input{
    padding:8px;
    width:300px;
    max-width:100%;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-bottom: 2em;
}

th,td{
    padding:8px;
    border:1px solid var(--border);
}

th{
    background:rgba(128,128,128,.15);
}

a{
    color:var(--link);
    cursor:pointer;
}

.rank{
    margin:6px 0;
}

.stat{
    display:inline-block;
    margin-right:20px;
    font-size:18px;
    font-weight:bold;
}
.performanceCheck{
    width:1em;
}

.actionbtn{
    background:#1565c0;
    color:white;
    border:1px solid #0d47a1;
}

.actionbtn:hover{
    background:#1976d2;
}
</style>
</head>

<body>

<header>
<h1>博多天神落語まつりアーカイブ</h1>
</header>

<main>

<div class="card">

<input id="searchText" placeholder="出演者・演目・会場・公演検索" onkeydown="if(event.key==='Enter'){searchData();}">

<button onclick="searchData()">検索</button>
<button onclick="showPerformerRanking()">出演者ランキング</button>
<button onclick="showStoryRanking()">演目ランキング</button>
<button onclick="showVenueIndex()">会場別表示</button>
<button onclick="showPerformanceIndex()">公演別表示</button>
<button onclick="showMultiPerformanceSelector()">複数公演表示</button>
<button onclick="showDashboard()">ダッシュボード</button>

</div>

<div id="content"></div>

</main>

<script>
const PERFORMANCE = {
    'F-1': { title: '20年目の幕開きでーす！', date: '2026/10/30', start: '15:00' },
    'N-1': { title: '南の光を浴びて実るぞ', date: '2026/10/30', start: '15:00' },
    'J-1': { title: '芸協会長にご馳走になる会', date: '2026/10/30', start: '15:00' },
    'F-2': { title: '招福寄席', date: '2026/10/31', start: '12:00' },
    'N-2': { title: 'こども寄席', date: '2026/10/31', start: '12:00' },
    'J-2': { title: '季節外れの節句で自酒', date: '2026/10/31', start: '12:00' },
    'F-3': { title: '上方落語に春が来た', date: '2026/10/31', start: '16:00' },
    'N-3': { title: '先輩の背中を見て育ちます', date: '2026/10/31', start: '16:00' },
    'J-3': { title: '君はどんな形の貯金箱？', date: '2026/10/31', start: '16:00' },
    'F-4': { title: '文が二つに治が二つで遊ぶ', date: '2026/11/01', start: '12:00' },
    'N-4': { title: 'もう好きにしてちょうだい', date: '2026/11/01', start: '12:00' },
    'J-4': { title: '小遊三神興を若手が担ぐ', date: '2026/11/01', start: '12:00' },
    'F-5': { title: '生粋の若旦那の蜜を吸う', date: '2026/11/01', start: '16:00' },
    'N-5': { title: '天神で桃組見ちゃおうよ', date: '2026/11/01', start: '16:00' },
    'J-5': { title: '落語ほど自由なものはない', date: '2026/11/01', start: '16:00' },
    'F-6': { title: '師匠！たっぷり願います', date: '2026/11/02', start: '12:00' },
    'N-6': { title: 'なんてったってアイドル？', date: '2026/11/02', start: '12:00' },
    'J-6': { title: '一花咲かせる落語まつり', date: '2026/11/02', start: '12:00' },
    'F-7': { title: '東西で陣地を取り合うぞ', date: '2026/11/02', start: '16:00' },
    'N-7': { title: '之輔なの？の輔なの？会？', date: '2026/11/02', start: '16:00' },
    'J-7': { title: '落語家だって人間だもの', date: '2026/11/02', start: '16:00' },
    'F-8': { title: '20年分の感謝を込める会', date: '2026/11/03', start: '12:00' },
    'N-8': { title: '菊の花がわんさかしらく3日', date: '2026/11/03', start: '12:00' },
    'J-8': { title: 'どうする？誰が古典やる？', date: '2026/11/03', start: '12:00' },
    'F-9': { title: '大きな花火を打ち上げよう', date: '2026/11/03', start: '16:00' },
    'J-9': { title: '感謝を落語の花束にして', date: '2026/11/03', start: '16:00' }
};
const skipKeys = ["公演回", "順"];
async function loadCSV(){
    const response = await fetch("rakugo_stories.csv");
    const csv = await response.text();

    const lines = csv
        .trim()
        .split(/\r?\n/)
        .filter(x=>x.trim());

    const headers = lines.shift().split(",");

    return lines.map(line=>{

        const cols = line.split(",");

        const obj = {};

        headers.forEach((h,i)=>{
            obj[h.trim()] = (cols[i]||"").trim();
        });

        return obj;
    });
}

const content = document.getElementById("content");


function renderTable(rows, hideColumns = [], showDate = true, append = false){

if(!rows.length){
    content.innerHTML +=
        "<div class='card'>該当データなし</div>";
    return;
}

let html =
    "<div class='card'><table>";

html += "<tr>";

const headers =
    Object.keys(rows[0])
    .filter(key =>
        !skipKeys.includes(key) &&
        !hideColumns.includes(key)
    );
if(showDate){
    html += "<th>日付</th>";
}
headers.forEach(k=>{
    html += `<th>${k}</th>`;
});

html += "</tr>";

rows.forEach(row=>{

    html += "<tr>";
    if(showDate){
        html += `<td>${
            PERFORMANCE[row["公演"]]?.date ?? ""
        }</td>`;
    }
    const renderCell = {

        "出演者": val =>
            `<a onclick="showPerformer('${escapeQuotes(val)}')">${val}</a>`,

        "演目": val =>
            `<a onclick="showStory('${escapeQuotes(val)}')">${val}</a>`,

        "公演": val =>
            `<a onclick="showPerformance('${escapeQuotes(val)}')">${val}</a>`,

        "会場": val =>
            `<a onclick="showVenue('${escapeQuotes(val)}')">${val}</a>`
    };

    headers.forEach(key=>{

        const value = row[key] ?? "";

        html += `<td>${
            renderCell[key]?.(value) ?? value
        }</td>`;
    });

    html += "</tr>";
});

html += "</table></div>";
if(append){
    content.innerHTML += html;
}else{
    content.innerHTML = html;
}
}

function escapeQuotes(x){
    return x.replace(/'/g,"\\'");
}

function searchData(){

const keyword =
    document.getElementById("searchText")
    .value
    .trim();

const result =
    DATA.filter(r =>
        JSON.stringify(r)
        .includes(keyword)
    );

content.innerHTML = `
<div class="card">
    <h2>検索結果</h2>
    <p>${result.length}件</p>
</div>
`;

renderTable(result);
}


function countField(field){

    const counts = {};

    DATA.forEach(r=>{

        const v = r[field];

        if(!v) return;

        counts[v] = (counts[v] || 0) + 1;
    });

    return Object.entries(counts)
        .sort((a,b)=>b[1]-a[1]);
}


function showPerformerRanking(){

    const ranking = countField("出演者");

    let html =
    `<div class="card">
        <h2>出演者ランキング</h2>`;

    ranking.forEach(([name,count],i)=>{

        html += `
        <div class="rank">
            ${i+1}位　
            <a onclick="showPerformer('${escapeQuotes(name)}')">
                ${name}
            </a>
            (${count}回)
        </div>`;
    });

    html += "</div>";

    content.innerHTML = html;
}


function showStoryRanking(){

    const ranking = countField("演目");

    let html =
    `<div class="card">
        <h2>演目ランキング</h2>`;

    ranking.forEach(([name,count],i)=>{

        html += `
        <div class="rank">
            ${i+1}位　
            <a onclick="showStory('${escapeQuotes(name)}')">
                ${name}
            </a>
            (${count}回)
        </div>`;
    });

    html += "</div>";

    content.innerHTML = html;
}


function showPerformer(name){

const rows =
    DATA.filter(x =>
        x["出演者"] === name);

content.innerHTML = `
<div class="card">

    <h2>${name}</h2>

    <p>
        出演回数 ${rows.length}回
    </p>

</div>
`;

renderTable(
    rows,
    ["出演者"]
);
}

function showStory(title){

const rows =
    DATA.filter(x =>
        x["演目"] === title);

content.innerHTML = `
<div class="card">

    <h2>${title}</h2>

    <p>
        上演回数 ${rows.length}回
    </p>

</div>
`;

renderTable(
    rows,
    ["演目"]
);
}


function showVenueIndex(){

    const venues =
        [...new Set(
            DATA.map(x=>x["会場"])
        )];

    let html =
    `<div class="card">
        <h2>会場一覧</h2>`;

    venues.forEach(v=>{

        const count =
            DATA.filter(x =>
                x["会場"]===v
            ).length;

        html += `
        <div>
            <a onclick="showVenue('${escapeQuotes(v)}')">
                ${v}
            </a>
            (${count})
        </div>`;
    });

    html += "</div>";

    content.innerHTML = html;
}


function showVenue(name){

const rows =
    DATA.filter(x =>
        x["会場"] === name);

content.innerHTML = `
<div class="card">

    <h2>${name}</h2>

    <div class="stat">
        出演数 ${rows.length}
    </div>

</div>
`;

renderTable(rows, ["会場"]);
}


function showPerformanceIndex(){

    const list =
        [...new Set(
            DATA.map(x=>x["公演"])
        )];

    let html =
    `<div class="card">
        <h2>公演一覧</h2>`;

        list.forEach(v=>{
        const showname = PERFORMANCE[v]?.title??'';

        html += `
        <div>
            <a onclick="showPerformance('${escapeQuotes(v)}')">
                ${v} ${showname}
            </a>
        </div>`;
    });

    html += "</div>";

    content.innerHTML = html;
}


function showPerformance(code){

const rows =
    DATA.filter(x =>
        x["公演"] === code);

const info =
    PERFORMANCE[code] || {};

const venue =
    rows[0]?.["会場"] ?? "";

content.innerHTML = `
<div class="card">

    <h2>${code}</h2>

    <h3>${info.title ?? ""}</h3>

    <p>
        ${info.date ?? ""}
        ${info.start ?? ""}
        開演
    </p>

    <p>
        ${venue}
    </p>

</div>
`;

renderTable(rows, ["公演","会場"], false);
}
function showMultiPerformanceSelector(){

const list =
    [...new Set(
        DATA.map(x => x["公演"])
    )];

let html = `
<div class="card">

    <button class="actionbtn" onclick="showSelectedPerformances()">
        選択完了
    </button>
`;

list.forEach(code => {

    const info =
        PERFORMANCE[code] || {};

    html += `
    <div>

        <label>

            <input
                type="checkbox"
                class="performanceCheck"
                value="${code}">

            ${code}
            ${info.title ?? ""}

        </label>

    </div>
    `;
});

html += `
</div>
`;

content.innerHTML = html;
}

function showSelectedPerformances(){

const selected =
    [...document.querySelectorAll(
        ".performanceCheck:checked"
    )]
    .map(x => x.value);

if(selected.length === 0){

    content.innerHTML = `
    <div class="card">
        公演を選択してください
    </div>
    `;

    return;
}

content.innerHTML = "";

selected.forEach(code => {

    const rows =
        DATA.filter(x =>
            x["公演"] === code);

    const info =
        PERFORMANCE[code] || {};

    const venue =
        rows[0]?.["会場"] ?? "";

    content.innerHTML += `
    <div class="card">

        <h3>${info.title ?? ""}</h3>

        <p>
            ${info.date ?? ""}
            ${info.start ?? ""}
            開演
            ${venue}
        </p>

    </div>
    `;

    renderTable(
        rows,
        ["公演", "会場"],
        false,
        true
    );

});
}
function showDashboard(){

    const performers =
        new Set(
            DATA.map(x=>x["出演者"])
        ).size;

    const stories =
        new Set(
            DATA.map(x=>x["演目"])
            .filter(Boolean)
        ).size;

    const venues =
        new Set(
            DATA.map(x=>x["会場"])
        ).size;

    const performances =
        new Set(
            DATA.map(x=>x["公演"])
        ).size;

    content.innerHTML = `
    <div class="card">
        <h2>ダッシュボード</h2>

        <div class="stat">
            公演数 ${performances}
        </div>

        <div class="stat">
            会場数 ${venues}
        </div>

        <div class="stat">
            出演者数 ${performers}
        </div>

        <div class="stat">
            演目数 ${stories}
        </div>
    </div>`;
}
let DATA = [];

(async () => {

    DATA = await loadCSV();

    showDashboard();

})();


</script>

</body>
</html>
